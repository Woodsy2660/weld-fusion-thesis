# Geometry modality configuration
# FROZEN PARAMETERS — do not tune against classification results.
# Each value is justified from ISO 5817:2023 or the physical setup.

sensor:
  type: realsense_d435i
  depth_resolution: [1280, 720]
  rgb_resolution: [1920, 1080]
  working_distance_mm: 320        # Measured standoff to weld surface
  working_distance_tolerance_mm: 5  # Acceptable variation across weld bead

# ---------------------------------------------------------------------------
# Registration — datum hole detection and pose solve
# ---------------------------------------------------------------------------
registration:
  # Datum hole positions in the coupon coordinate system (s, y) in mm.
  # Origin hole at low-s end, axis hole at high-s end.
  # Both holes in the same plate half (+y side), 20mm from the outer edge.
  origin_hole:
    s_mm: 15
    y_mm: 50
    diameter_mm: 6
  axis_hole:
    s_mm: 285
    y_mm: 50
    diameter_mm: 8  # Different diameter breaks end-for-end ambiguity

  # Plate edge cross-check: if hole-derived and edge-derived origins disagree
  # by more than this, flag the coupon for review.
  edge_crosscheck_tolerance_mm: 2.0

  # Minimum hole detection confidence (0-1). Below this, registration fails.
  min_hole_confidence: 0.8

# ---------------------------------------------------------------------------
# Cell structure — matches UT index pitch
# ---------------------------------------------------------------------------
cells:
  width_mm: 25              # Matches UT index pitch for 1:1 cell alignment
  first_excluded_mm: 25     # Arc-start transient zone
  last_excluded_mm: 25      # Arc-stop transient zone
  coupon_length_mm: 300     # Nominal; actual measured per coupon

# ---------------------------------------------------------------------------
# Profile extraction — ISO 5817 undercut measurement
# ---------------------------------------------------------------------------
profile_extraction:
  # Number of transverse profiles per cell. ISO 5817 judges undercut by its
  # deepest point, so we sample multiple profiles and take a high quantile.
  profiles_per_cell: 10

  # Aggregation quantile for undercut depth across profiles.
  # 0.95 = 95th percentile, capturing near-worst-case without being
  # dominated by a single noisy pixel.
  # Justification: ISO 5817 specifies "maximum depth of undercut" — this
  # approximates the maximum while providing robustness to outliers.
  aggregation_quantile: 0.95

  # Smoothing kernel size (pixels) for profile noise reduction.
  # Applied along each transverse slice before feature extraction.
  smoothing_kernel_px: 5

  # Undercut datum definition: the reference surface from which undercut
  # depth is measured. ISO 5817 defines undercut as "a groove melted into
  # the parent metal... at the weld toe".
  # We fit a plane to the parent metal regions and measure depth below it.
  #
  # ROI for plane fit: distance from weld centreline (y) in mm.
  # Must be on parent metal, outside the HAZ, but inside the plate edge.
  plane_fit_roi:
    y_inner_mm: 15    # Start of parent metal region (outside bead)
    y_outer_mm: 40    # End of parent metal region (inside plate edge)

  # Datum construction within that band. CHANGED 2026-10-11 from an implicit
  # median to a fitted line; see docs/DECISIONS.md.
  #
  # "median" (legacy): one level per side, the median of the 15-40 mm band.
  #   That level represents the surface at y ~ 27.5 mm, but ISO 5817 measures
  #   undercut depth at the weld toe, near y ~ 12 mm. Extrapolating a constant
  #   across that 15.5 mm gap costs (local slope x 15.5 mm). C11 measured
  #   2.37 deg between the plate halves -> 0.643 mm of datum error, larger
  #   than the 0.5 mm Level B limit being measured.
  #
  # "linear" (default): fit depth = a*y + b over the same band, per side, per
  #   transverse profile, and evaluate it at the toe. Removes the slope term.
  #   Residual error is then set by surface curvature over the 25 mm band:
  #   f'' * w^2 / 8 = 0.026 mm for the measured 1.5 mm p-p, 300 mm undulation.
  #
  # The band itself is unchanged and stays frozen: 15 mm clears the HAZ and the
  # bead toe, 40 mm stays inside the 70 mm plate half-width with margin.
  datum_mode: linear

  # Weld bead detection: the region around centreline where the bead sits.
  # Undercut is measured at the transition between bead and parent metal.
  bead_roi:
    y_half_width_mm: 12  # Bead extends ±12mm from centreline (typical)

  # Minimum valid depth pixels required in the plane-fit ROI.
  # Below this, the cell maps to Θ (vacuous BPA).
  # Justification: at 0.445 mm/px lateral, a 25mm cell is ~56 px wide.
  # The plane-fit ROI spans ~50mm = ~112 px. 60% validity = 67 px minimum.
  min_valid_fraction: 0.60

# ---------------------------------------------------------------------------
# Uncertainty budget — four terms
# ---------------------------------------------------------------------------
uncertainty:
  # Quantization uncertainty: depth_units = 0.1mm, uniform distribution.
  # u_quant = 0.1 / sqrt(12) = 0.029 mm
  u_quant_mm: 0.029

  # Calibration uncertainty: RMS residual from plane fit to flat reference.
  # Measured via Depth Quality Tool; this is the default if not measured.
  u_cal_mm_default: 0.030

  # Alignment uncertainty: fixture repeatability from repeat-placement captures.
  # This is measured, not assumed. Default is a conservative estimate.
  u_align_mm_default: 0.020

  # Noise floor: minimum achievable even with infinite averaging.
  # Stereo matching has systematic errors that don't average out.
  # Measured from split-half comparison on a flat target.
  noise_floor_mm_default: 0.015

  # MEASURED repeatability (2026-10-20), C05_top r0/r1/r2 re-placement repeats,
  # 10 cells, pooled SD across repeats, local-fit extractor + weld-axis seeds
  # (scripts/geometry_repeatability.py). These replace the four-term budget
  # above (RSS 0.049 mm; the 0.083 mm figure quoted elsewhere has no source in
  # this repo) as the honest u per measurand. NOT yet used for BPAs:
  # use_for_bpa stays false until LIMITATIONS.md L2 (bead reads as a trench) is
  # resolved, because the undercut and reinforcement values are contaminated
  # by it. Misalignment is plate-only and unaffected.
  measured_repeatability:
    use_for_bpa: false
    source: "results/geometry/_diagnostics/repeatability_C05_top_axisseeds.json"
    undercut_mm: 0.586
    reinforcement_mm: 0.493
    misalignment_mm: 0.275

# ---------------------------------------------------------------------------
# ISO 5817:2023 acceptance criteria — Level B (stringent)
# ---------------------------------------------------------------------------
acceptance_criteria:
  standard: "ISO 5817:2023"
  quality_level: "B"
  plate_thickness_mm: 10

  # Level B, t > 3 mm (corrected 2026-10-20 per supervisor/author review of
  # ISO 5817 Table 1; the previous misalignment form 0.2 + 0.1t is the
  # 0.5-3 mm thickness band and gave 1.2 mm instead of 1.0 mm at t = 10).
  # limit = min(coef * x, cap). U in configs/frame.yaml is the DISJUNCTION of
  # all three, so all three drive m({U}) (rules.build_cell_bpa).
  #
  # Undercut (5011/5012): h <= 0.05 t, max 0.5 mm  -> 0.5 mm at t = 10
  undercut_coef_t: 0.05
  undercut_max_mm: 0.5
  # Excess weld metal (502): h <= 1 mm + 0.1 b, max 5 mm
  reinforcement_base_mm: 1.0
  reinforcement_coef_b: 0.1
  reinforcement_max_mm: 5.0
  # Linear misalignment (507), plates: h <= 0.1 t, max 3 mm -> 1.0 mm at t = 10
  misalignment_coef_t: 0.1
  misalignment_max_mm: 3.0

# ---------------------------------------------------------------------------
# Tilt correction
# ---------------------------------------------------------------------------
tilt_correction:
  # Apply tilt correction: d_true = Δz · cos(φ)
  # φ is derived from the plane-fit normal vector.
  enabled: true

  # Maximum acceptable tilt angle (degrees). Above this, flag for review.
  # At 5°, cos(5°) = 0.996, so the error is < 0.4%.
  max_tilt_deg: 5.0
