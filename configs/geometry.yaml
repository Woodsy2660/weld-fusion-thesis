acceptance_criteria:
  standard: iso_5817_2023
  quality_level: B
  plate_thickness_mm: 10.0
  limits:
    undercut_max_mm: 0.5
    undercut_ratio: 0.05          # h <= 0.05 t
    reinforcement_max_mm: 5.0
    reinforcement_offset_mm: 1.0  # h <= 1 + 0.1 b
    reinforcement_width_coeff: 0.1
    misalignment_max_mm: 3.0
    misalignment_ratio: 0.1       # h <= 0.1 t + 0.2 mm
    misalignment_offset_mm: 0.2

uncertainty:
  u_cal_mm: 0.02
  u_noise_mm: 0.028   # ~25-row average of D435 at 200 mm standoff
  u_align_mm: 0.05

profile_extraction:
  n_rows: 25
  smoothing_kernel_size: 5
  base_plate_detection: ransac    # primary; outer_median is the implemented fallback
  pixel_pitch_mm: 0.1
