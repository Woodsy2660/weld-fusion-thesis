model:
  architecture: resnet50
  pretrained: imagenet
  # num_classes is derived from configs/frame.yaml (len(theta)); do not hardcode.
  freeze_layers: false

data:
  train_dir: data/processed/vision/train
  val_dir: data/processed/vision/val
  test_dir: data/processed/vision/test
  image_size: 224
  batch_size: 32
  num_workers: 4

augmentation:
  horizontal_flip: true
  rotation_degrees: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
  random_resized_crop:
    scale: [0.8, 1.0]

training:
  optimizer: adam
  learning_rate: 0.0001
  weight_decay: 0.0001
  epochs: 50
  early_stopping_patience: 10
  scheduler:
    type: cosine
    min_lr: 0.000001

normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
