# Vision training configuration for 4-head classifier (V1-V4).
#
# Vision heads (from frame.yaml):
#   V1: {P}       surface-breaking porosity
#   V2: {C}       surface-breaking crack
#   V3: {N,U}     surface irregularity present, depth not measurable
#   V4: {N,U,L}   surface clean - sound, sub-visible undercut, or internal LOF
#
# V2 is expected to be empty (no crack data). Training fails if an active
# head has zero samples - either add data or remove from active_heads.

model:
  architecture: resnet50
  pretrained: true
  freeze_epochs: 5  # Train classifier head only for first N epochs

# Heads to train. V2 excluded because we have no crack training data.
active_heads:
  - V1
  - V3
  - V4

training:
  seed: 42
  n_folds: 5
  batch_size: 32
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  min_lr: 0.000001
  early_stopping_patience: 10
  num_workers: 4

data:
  image_size: 224

normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotation_degrees: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.1
  random_affine:
    translate: [0.1, 0.1]
