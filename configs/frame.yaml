# Dempster-Shafer frame of discernment and per-modality focal elements.
# FOUR-CLASS EXPERIMENTAL FRAME.
#
# SINGLE SOURCE OF TRUTH. No module may hardcode the head count or the
# head-to-focal-element mapping; read it from here via
# src/utils/frame.py:load_frame().
#
# C (crack) is REMOVED from the experimental frame because:
# - No crack surrogate specimens could be fabricated
# - Vision V2 {C} was already deleted for lack of support (precision 0.19)
# - Zero experimental samples exist for the C class
#
# The 5-class frame is retained in frame_5class.yaml for analytical ceiling
# derivation. The proposition "V+G cannot isolate {L}" is proved there.

# ---------------------------------------------------------------------------
# Theta -- the frame of discernment. Four classes.
# ---------------------------------------------------------------------------
classes:
  N: "no defect / acceptable"
  U: "geometric non-conformance to ISO 5817 - undercut, excess reinforcement, or misalignment beyond limits"
  P: "porosity"
  L: "lack of fusion / lack of penetration"

# ---------------------------------------------------------------------------
# Vision focal elements -- THREE heads.
#
#   V1  {P}        surface-breaking porosity
#   V3  {N,U}      surface geometric anomaly present, magnitude unmeasured
#   V4  {N,U,L}    no conclusive surface evidence
#
# V2 {C} was removed earlier (precision 0.19, 60 patches from 46 frames).
# The numbering deliberately skips V2 so existing artefacts stay valid.
#
# V4 NARROWED from {N,U,L,C} to {N,U,L} because C is no longer in Theta.
# This is not a claim that vision can exclude cracks -- it is a consequence
# of the experimental frame having no crack class to place mass on.
#
# Vision still NEVER predicts U alone: it can see that a bead deviates but
# cannot measure the deviation against the ISO 5817 limit. Geometry does that,
# which is why V3 is the compound {N,U} rather than the singleton {U}.
#
# Vision still NEVER predicts L alone. Lack of fusion is subsurface and has
# no reliable surface signature. L appears only inside V4.
#
# Head order below is the CLASSIFIER OUTPUT ORDER. V1 < V3 < V4 sorts
# correctly, so directory order and this order agree; load_frame() asserts it.
# ---------------------------------------------------------------------------
vision_heads:
  V1: ["P"]
  V3: ["N", "U"]
  V4: ["N", "U", "L"]

# ---------------------------------------------------------------------------
# Focal elements the other modalities are entitled to commit mass to.
# validate_modality_bpa() is parameterised by modality and reads these.
#
# geometry measures the bead profile against ISO 5817. It resolves U directly
# -- the only modality that can -- and is blind to everything else, so its
# ignorance head is {N,P,L}.
#
# ut resolves subsurface defects. With C removed from the frame, UT now has
# three heads: U1={P}, U2={L}, U4={N,U}. U3={C} is removed.
# It cannot distinguish a sound weld from a surface geometry problem, so {N,U}
# is its compound.
# ---------------------------------------------------------------------------
geometry_heads:
  G1: ["U"]
  G2: ["N", "P", "L"]

ut_heads:
  U1: ["P"]
  U2: ["L"]
  U4: ["N", "U"]
