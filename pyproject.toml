[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weldfusion"
version = "0.1.0"
description = "Multi-modal Dempster-Shafer fusion for structural steel butt-weld defect classification"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Benjamin Wood" }]
license = { text = "All rights reserved" }
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "pyyaml>=6.0",
    "opencv-python>=4.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
